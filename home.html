<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BLUE | Dê voz ao conhecimento</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head><body><header>
    <img src="assets/logo_blue.png" width="90" alt="Logo BLUE">

    <div>
        Olá, estudante!
        <button onclick="logout()">Sair</button>
    </div>
</header>

<main>
    <section class="card">
        <h2>🎤 Gravação e transcrição</h2>

        <button onclick="iniciarGravacao()">Iniciar gravação</button>
        <button onclick="pararGravacao()">Parar gravação</button>

        <textarea
            id="textoAula"
            placeholder="A transcrição da aula aparecerá aqui..."
        ></textarea>
    </section>

    <section class="card">
        <h2>📚 Material de estudo</h2>

        <p>
            Gere um resumo e um mapa mental usando o texto
            que já foi transcrito.
        </p>

        <button id="btnGerar" onclick="gerarEstudo()">
            ✨ Gerar resumo e mapa mental
        </button>

        <div id="resultado" aria-live="polite"></div>
    </section>

    <section class="card">
        <h2>📄 Exportar PDF</h2>

        <button onclick="gerarPDF()">Baixar material</button>
    </section>
</main>

<script src="script.js"></script>

</body>
</html>
