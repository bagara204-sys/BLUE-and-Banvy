<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BLUE — Dê voz ao conhecimento</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="login-container">

    <img src="assets/escola.png" width="160" alt="Logo da escola">

    <h1>BLUE</h1>
    <h3>Dê voz ao conhecimento</h3>

    <input
        type="text"
        id="usuario"
        placeholder="Usuário"
        autocomplete="username"
    >

    <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password"
    >

    <button onclick="login()">Entrar</button>

    <p onclick="cadastro()" class="cadastro">
        Não tem conta? Cadastre-se
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
